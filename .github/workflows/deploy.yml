name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: |
          npm run build -- \
            --configuration production \
            --base-href "https://blindmonk.in/"

      - name: Copy CNAME for custom domain
        run: echo "blindmonk.in" > dist/blindmonk-website/browser/CNAME

      - name: Add .nojekyll
        run: touch dist/blindmonk-website/browser/.nojekyll

      - name: SPA fallback for 404
        run: cp dist/blindmonk-website/browser/index.html dist/blindmonk-website/browser/404.html

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/blindmonk-website/browser
          branch: pages
