<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="monkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blindfoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Tech Circuit Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Monk Silhouette Base -->
  <!-- Hood / Head Contour -->
  <path d="M 250 110 C 180 110, 150 170, 150 240 C 150 310, 180 370, 250 380 C 320 370, 350 310, 350 240 C 350 170, 320 110, 250 110 Z" fill="url(#monkGrad)"/>

  <!-- Inner Hood Void / Shadow -->
  <path d="M 250 135 C 195 135, 170 185, 170 245 C 170 305, 195 355, 250 362 C 305 355, 330 305, 330 245 C 330 185, 305 135, 250 135 Z" fill="#0f172a"/>

  <!-- Monk Face Outline -->
  <path d="M 250 165 C 210 165, 195 200, 195 245 C 195 290, 210 325, 250 330 C 290 325, 305 290, 305 245 C 305 200, 290 165, 250 165 Z" fill="#1e293b"/>

  <!-- Cybernetic Blindfold (Glowing Tech Strip) -->
  <g filter="url(#glow)">
    <path d="M 160 220 L 340 220 L 330 255 L 170 255 Z" fill="url(#blindfoldGrad)" rx="5"/>
    <line x1="160" y1="237.5" x2="340" y2="237.5" stroke="#ffffff" stroke-width="3" stroke-dasharray="15 6" opacity="0.9"/>
  </g>

  <!-- Third Eye / Insight AI Symbol on Blindfold -->
  <circle cx="250" cy="237.5" r="10" fill="#ffffff"/>
  <circle cx="250" cy="237.5" r="5" fill="#0284c7"/>

  <!-- Zen Meditation Dots / Circuit Nodes -->
  <circle cx="250" cy="185" r="4" fill="#f59e0b"/>
  <circle cx="220" cy="195" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="280" cy="195" r="3" fill="#f59e0b" opacity="0.7"/>

  <!-- Brand Name Typography beneath/within -->
  <text x="250" y="440" text-anchor="middle" font-family="'Sora', 'Inter', sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="2">
    BLIND<tspan fill="#f59e0b">MONK</tspan>
  </text>
</svg>
